name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    # Everything that can fail must fail here, before the publish job runs:
    # once a version is on PyPI it cannot be replaced, only yanked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: pytest

      - name: Fail if the release tag does not match midas_nx.__version__
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import midas_nx; print(midas_nx.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match __version__ ${pkg}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches __version__ ${pkg}"

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Install the built wheel into a clean venv and smoke-test it
        run: |
          set -euxo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cp scripts/wheel_smoke_test.py /tmp/wheel_smoke_test.py
          cd /
          /tmp/smoke/bin/python /tmp/wheel_smoke_test.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Deliberately tracked by branch, not pinned to a SHA like the actions
      # above: PyPA publishes Trusted Publishing / OIDC fixes on release/v1 and
      # recommends following it. Pinning here risks a stale OIDC client that
      # can no longer authenticate to PyPI.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
