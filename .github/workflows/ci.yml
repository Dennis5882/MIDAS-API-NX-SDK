name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run generate
        working-directory: packages/typescript
      - name: Fail if generated TypeScript files drifted
        run: git diff --exit-code -- schema/typescript-resources.json schema/typescript-coverage.json packages/typescript/src/generated
      - run: npm run typecheck
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
      - run: mkdir -p ../../package-artifact && npm pack --pack-destination ../../package-artifact
        working-directory: packages/typescript
      - name: Verify safety JSDoc reached the published declarations
        run: |
          grep -q "WARNING: Confirmed crashing Gen NX" packages/typescript/dist/index.d.ts
          grep -q "A timeout is not a rollback" packages/typescript/dist/index.d.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: package-artifact/*.tgz

  typescript-package-smoke:
    needs: typescript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package-artifact
      - run: mkdir smoke
      - name: Install and import the packed npm artifact
        working-directory: smoke
        run: |
          set -euxo pipefail
          npm init -y >/dev/null
          npm install --ignore-scripts ../package-artifact/midas-nx-*.tgz
          node -e "const m = require('midas-nx'); if (m.resourceCount !== 304) process.exit(1)"
          node --input-type=module -e "const m = await import('midas-nx'); if (m.tableCount !== 87) process.exit(1)"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml's classifiers claim support for.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: mypy

  package:
    # Builds the real artifact and installs it where the source tree can't be
    # imported instead, so packaging bugs (a missing py.typed, a module left
    # out of the wheel) fail here rather than after publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Install the built wheel into a clean venv and smoke-test it
        run: |
          set -euxo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cp scripts/wheel_smoke_test.py /tmp/wheel_smoke_test.py
          # Run from / so a stray import can't resolve against ./src.
          cd /
          /tmp/smoke/bin/python /tmp/wheel_smoke_test.py
