    provenance: manual
  - value: SOLID_LOCA_TOTAL_STRAIN
    description: Local total solid strain
    head: [Index, Elem, Load, Step, Node, Strain-xx, Strain-yy, Strain-zz, Strain-xy, Strain-yz, Strain-xz, Strain-P1, Strain-P2, Strain-P3, Max-Shear]
