# Displacements — a table on the shared /post/TABLE route.
#
# Sources: docs/manual/19_POST_AnalysisResult_1.md #2 in Dennis5882/MIDAS-API.
# No SDK source was consulted.
contractVersion: 1
id: post-displacements
endpoint: /post/TABLE
name: Displacements
summary: Nodal displacements, in the global or local frame.

products: [gen, civil]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 19_POST_AnalysisResult_1.md
    section: "2. Displacements"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: gen
      ref: post-table-response-key-2026-07-26
    - product: civil
      ref: post-table-response-key-2026-07-26

risk: read_only

tableTypes:
  - value: DISPLACEMENTG
    description: Global coordinate system
    head: ["Index", "Node", "Load", "DX", "DY", "DZ", "RX", "RY", "RZ"]
    headNote: A construction-stage query inserts Stage and Step columns after Load.
    provenance: manual

  - value: DISPLACEMENTL
    description: Local coordinate system
    head: ["Index", "Node", "Load", "DX", "DY", "DZ", "RX", "RY", "RZ"]
    headNote: >-
      The manual gives one HEAD for both variants, unlike Reaction where the
      local variant switches to lower-case component names. Not checked against
      a running product.
    provenance: manual

requestFields:
  additional:
    - key: DISP_OPT
      description: >-
        How construction-stage displacement is reported - Accumulative, Current
        or Real.
      type: string
      requirement: optional
      provenance: manual
