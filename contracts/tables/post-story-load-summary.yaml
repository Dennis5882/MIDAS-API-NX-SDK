# The manual labels these STORY_LOAD_SUMMARY_{X,Y,Z}; live Gen NX accepts only
# STORY_LOAD_{X,Y,Z}. Both facts are recorded below; no SDK source was used.
contractVersion: 1
id: post-story-load-summary
endpoint: /post/TABLE
name: Story Load Summary Table
summary: Per-story load totals in a selected direction.
products: [gen]
source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 18_POST_PreProcess.md
    section: "9. Story Load Summary Table"
  liveNotes:
    - docs/live_verification_notes.md
verification:
  status: verified_gen
  records:
    - product: gen
      ref: db-write-sweep-2026-08-13
risk: read_only
tableTypes:
  - value: STORY_LOAD_X
    description: X-direction story load
    head: [Index, Load, Story, Level, Concent, Beam, Floor, Pressure, SelfWeight, Sum]
    provenance: live_corrected
  - value: STORY_LOAD_Y
    description: Y-direction story load
    head: [Index, Load, Story, Level, Concent, Beam, Floor, Pressure, SelfWeight, Sum]
    provenance: live_corrected
  - value: STORY_LOAD_Z
    description: Z-direction story load
    head: [Index, Load, Story, Level, Concent, Beam, Floor, Pressure, SelfWeight, Sum]
    provenance: live_corrected
manualDefects:
  - describes: table_type
    manualSays: STORY_LOAD_SUMMARY_X, STORY_LOAD_SUMMARY_Y, and STORY_LOAD_SUMMARY_Z.
    actual: STORY_LOAD_X, STORY_LOAD_Y, and STORY_LOAD_Z on Gen NX; Civil NX rejects both spellings.
    evidence: >-
      docs/live_verification_notes.md, 2026-08-20 and 2026-08-25: Gen NX
      accepts STORY_LOAD_X and rejects STORY_LOAD_SUMMARY_X as an unrecognised
      table type; Civil NX rejects both. The manual's published correction is
      therefore wrong.
    resolved: true
