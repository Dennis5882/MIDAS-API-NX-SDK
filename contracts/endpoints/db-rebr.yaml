manualDefects:
  - describes: field_name
    manualSays: >-
      The 파라미터 table numbers the ITEMS item's members `(1)` to `(6)` and has
      no row for `ID` or for `ELEMS`. Its third table, headed
      "`CREATE_SUB_SECTION == true` 일 때 — `ELEMS`", then lists four rows at two
      different levels without saying so: `(1)` `ID` and a/b/c `KEYS`/`TO`/
      `STRUCTURE_GROUP_NAME`.
    actual: >-
      The section's own JSON Schema declares both missing members on the ITEMS
      item - `ID` as a read-only integer and `ELEMS` as an object whose
      description carries the condition verbatim - and places `KEYS`, `TO` and
      `STRUCTURE_GROUP_NAME` inside `ELEMS`, not beside `ID`. Chapter 26's
      `/DESIGN/RC/KDS-41-20-2022/REBC` and `.../REBR` document the same two
      members as ordinary numbered rows of their Parameters tables, so this is
      chapter 24 leaving out what its sibling chapter states. Same shape as
      MD-22: a row the table does not have, supplied by a second statement in
      the same section. The npm and Python surfaces are unaffected - both
      already send `ELEMS` - so this is a documentation defect only.
    evidence: >-
      docs/manual/24_DB_Design.md section 13's 파라미터 and ELEMS tables against
      the JSON Schema printed immediately above them in the same section, and
      against docs/manual/26_DESIGN_RC_KDS.md's REBC/REBR Parameters tables.
      Registered as MD-26.

sdkRules:
  - id: db-rebr-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-rebr-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
  source: 24_DB_Design.md line 1982
  table: 파라미터
  structuralTables:
    - heading: SHEAR_BAR_END / SHEAR_BAR_CEN 객체 (공통 구조)
      line: 1998
      paths:
        - Assign.ITEMS.SHEAR_BAR_END
        - Assign.ITEMS.SHEAR_BAR_CEN
    - heading: "CREATE_SUB_SECTION == true 일 때 — ELEMS (KEYS / TO /
        STRUCTURE_GROUP_NAME 중 택1)"
      line: 2007
      paths:
        - Assign.ITEMS
        - Assign.ITEMS.ELEMS
      note: >-
        Hand-resolved rather than registered. This table has two destinations:
        its `(1)` row is the item's own `ID` and its a/b/c rows are members of
        `ELEMS`, one level deeper. A `StructuralTableMerge` appends a table's
        whole field list to each target, so no registry entry could split it,
        and merging it to either target alone would place three fields wrong.
        The split follows the section's JSON Schema. The field list below is
        complete, so this is not an `unmergedTables` entry. See MD-26.
