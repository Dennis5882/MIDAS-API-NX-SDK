sdkRules:
  - id: db-this-m1-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-this-m1-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

manualDefects:
  - describes: field_name
    manualSays: >-
      In the "M&S Proportional 감쇠 세부 필드 (DAMPING_METHOD=1)" table's
      `COEF_INPUT=1` branch, rows 3 and 5 are keyed `FREQ1`/`PERIOD1` and
      `FREQ2`/`PERIOD2` - two wire property names in one Key cell each.
    actual: >-
      They are two mutually exclusive properties, and the same rows say which
      applies: row 3's own description reads "모드1 주파수(COEF_CALC=0) /
      주기(COEF_CALC=1)", and `COEF_CALC` is the row above it, typed
      `Integer(enum)` as "계산 기준 (0=Frequency, 1=Period)". The contract
      declares four fields - `FREQ1`, `PERIOD1`, `FREQ2`, `PERIOD2` - each
      `conditional` on the `COEF_CALC` value its own row names. Same family as
      MD-07, MD-08, MD-13, MD-20 and MD-21: a Key cell carrying a set rather
      than one property, with the answer elsewhere in the same section.
    evidence: >-
      docs/manual/09_DB_Dynamic_Loads.md section 7-2, the `COEF_INPUT=1` table
      at line 1774 read against its own 설명 column. Registered as MD-23.

extraction:
  source: 09_DB_Dynamic_Loads.md line 1714
  table: 공통 파라미터
  # Additional parameter tables in this section were NOT merged. They are
  # usually conditional variants selected by a type/code field. Decide
  # whether they belong in this contract's fields, as nested `properties`,
  # or as a separate contract - do not assume the first table is the whole
  # schema.
  unmergedTables:
    - heading: 비선형 경계요소 해석 (BOUNDARY_NL_ANAL)
      fields: 2
      line: 1806
      resolution: >-
        Left unmerged deliberately, and the field list is therefore incomplete.
        The manual names this object and types its two members (METHOD, TOL)
        but never says where it hangs: BOUNDARY_NL_ANAL appears exactly once in
        the whole chapter, as this table's heading, with no Request Example
        nesting it and no row for it in the common table. A 2026-08-27 live
        round trip recorded in docs/live_verification_notes.md observed the
        server auto-filling NONL_CTRL_PARAM "including a nested
        BOUNDARY_NL_ANAL", which establishes that it exists but not whether it
        sits directly under NONL_CTRL_PARAM or under its ITER_CTRL. Guessing
        between the two would put an unverifiable path in the source of truth,
        and settling it needs a POST for which no confirmed fixture exists.
