# /db/STRPSSM
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-strpssm
endpoint: /db/STRPSSM
name: Section Manager – Stress Points

products: [civil]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 04_DB_Properties.md
    section: "17. `/db/STRPSSM`"
    url: https://support.midasuser.com/hc/en-us/articles/35943448721177
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_civil
  records:
    - product: civil
      ref: db-read-sweep-2026-08-16

operations:
  - method: DELETE
    variant: per_id
    path: /db/STRPSSM/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: OPT_SAME_J
    description: >-
      Same Stress Points at i and j-end
    type: boolean
    requirement: optional
    documentedDefault: true
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: POINT_SIZE_1
    description: >-
      Number of Stress Points (I)
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: POINT_SIZE_2
    description: >-
      Number of Stress Points (J)
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: POINT1
    description: >-
      Stress Point Coordinates (I)
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: PY
        description: >-
          Point Y
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # NOTE: the manual nests this under 'POINT1' by numbering it '(1)', not by
        # naming a path
      - key: PZ
        description: >-
          Point Z
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
        # NOTE: the manual nests this under 'POINT1' by numbering it '(2)', not by
        # naming a path
  - key: POINT2
    description: >-
      Stress Point Coordinates (J)
    type: array
    items:
      type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual

sdkRules:
  - id: db-strpssm-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-strpssm-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

extraction:
