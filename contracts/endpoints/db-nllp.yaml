sdkRules:
  - id: db-nllp-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-nllp-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

manualDefects:
  - describes: field_name
    manualSays: >-
      The common-parameter table lists the envelope fields only, and the
      section's own note says the per-device parameter sets (LRBI, FPSI, GAP,
      HOOK and the rest) are deliberately not transcribed from MIDASIT's
      article, which runs past 6000 lines.
    actual: >-
      The product stores them. SEIS_TYPE, SEIS_PROP, LDP_EFF_STIFF_COUPLED_ITEMS,
      LDP_EFF_DAMPING_COUPLED_ITEMS and ITEMS (per-component detail keyed by
      device) are declared identically by GET /info/db/NLLP on both products, and
      a FORCE/LRBI record carrying them is stored and round-trips on Civil NX,
      where the manual's ELEMENT/SPG example is refused. Not a transcription
      error in the vendored chapter so much as a stated omission; recorded here
      so the contract can hold the fields the extractor cannot see.
    evidence: >-
      schema/info-baseline.json (/db/NLLP, Civil NX and Gen NX); Civil NX
      2026-10-26, the LRB tutorial model's record through
      scripts/live_crud_check.py and live-crud.mjs (ledger-write-2026-10-26-5).

knownDefects:
  - ref: db-delete-body-empties-table

