  exportName: generalLinkProperty
  modulePath: [db, boundary]
  payloadTypeName: GeneralLinkPropertyPayload

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 05_DB_Boundary.md
    section: "8. `/db/NLLP` — General Link Properties"
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: tutorial-models-civil-2026-10-26
    - product: gen
      ref: civil-tutorial-cases-gen-2026-10-27

operations:
  - method: DELETE
    variant: per_id
    path: /db/NLLP/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: unstable
    notes: >-
      The server renumbers a POSTed record to the next free id. On Civil NX
      (2026-10-26, a copy of the LRB tutorial model holding ids 1-2) a record sent
      under key 50 landed at id 3 while the response echoed key 50. Read the table
      back and match on PROPERTY_NAME before updating or deleting by id.
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

