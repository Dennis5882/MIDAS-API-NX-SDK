# /db/WIND
#
# Written from GET /info/db/WIND (Gen NX, captured 2026-11-04) and the 2026-11-04
# Gen NX session in docs/live_verification_notes.md. The manual has no
# section for this endpoint, so every field is provenance: info_schema and
# requirement: unstated; live findings are recorded on the fields they touch.
contractVersion: 1
id: db-wind
endpoint: /db/WIND
name: Wind Loads (legacy)
summary: >-
  The legacy per-country static wind loads, one record per wind load case. MIDASIT keeps it without maintenance; it is the only API route for the overseas codes, since /db/SWIND takes KDS and USER TYPE only.
surface:
  className: LegacyWindLoad
  exportName: legacyWindLoad
  modulePath: [db, staticLoads]
  payloadTypeName: LegacyWindLoadPayload

products: [gen]
productsEvidence: >-
  Measured on Gen NX only, 2026-11-04. Civil NX was not connected that day, so
  Civil is unchecked rather than refused; widen once a Civil session answers.

recordKey:
  kind: record_id
  description: >-
    The /db/STLD load case number the record belongs to.

source:
  manual:
    status: absent
    justification: >-
      No manual chapter documents /db/WIND. The fields below are the server's own GET /info/db/WIND schema; methods, the record key and the failure shapes come from the 2026-11-04 Gen NX session recorded in docs/live_verification_notes.md, which wrote, updated and deleted records of 28 codes. WIND_CODE takes the legacy names listed there (EURO2005, CH2001, ASCE7(2016), NSCP 2024, ...), not the dialog's spellings, and the matching parameters go in the object of that code.
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_gen
  records:
    - product: gen
      ref: db-wind-seis-legacy-2026-11-04

operations:
  - method: DELETE
    variant: per_id
    path: /db/WIND/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Measured 2026-11-04 on Gen NX: removed the named record, and a GET of it
      then answered Not Found Key - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The /db/* body form, never sent to this endpoint; listed so both SDKs
        guard it like every other table.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

