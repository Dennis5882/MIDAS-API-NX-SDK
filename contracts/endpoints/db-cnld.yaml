sdkRules:
  - id: db-cnld-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-cnld-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

  - id: db-cnld-item-component-defaults
    kind: normalize_defaults
    appliesTo: [POST, PUT]
    fields: [GROUP_NAME, FX, FY, FZ, MX, MY, MZ]
    values:
      GROUP_NAME: ""
      FX: 0.0
      FY: 0.0
      FZ: 0.0
      MX: 0.0
      MY: 0.0
      MZ: 0.0
    reason: >-
      A PUT onto a node that already carries loads stores every component an
      ITEMS entry leaves out with the value of the node's first entry, not
      the documented 0, and answers as if nothing were wrong. Measured on Gen
      NX 2026-10-27: an entry for a third load case sent with FY 1.5 only was
      stored with FZ -20, the first entry's; an entry rewritten with FX only
      lost its own FZ to the first entry's. The same omission on a node with
      no loads is harmless, and sending all six components gives the
      documented result either way. GROUP_NAME is inherited the same way - a
      new entry joined the first entry's load group (measured the same day).
      Civil NX measured the same on 2026-10-28 for FZ and GROUP_NAME: a new
      entry sent with FY 1.5 only was stored with the first entry's FZ -20 and
      load group. The values are the manual's own defaults.
    riskRef: db-items-put-inherits-first-entry

knownDefects:
  - ref: db-items-put-inherits-first-entry
  - ref: db-delete-body-empties-table

