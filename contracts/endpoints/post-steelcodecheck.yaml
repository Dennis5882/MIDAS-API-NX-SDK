# /post/STEELCODECHECK
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: post-steelcodecheck
endpoint: /post/STEELCODECHECK
name: Steel Code Check

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 23_POST_Design.md
    section: 2. Steel Code Check
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-read-sweep-2026-07-31
    - product: gen
      ref: steel-frame-gen-2026-10-20

knownDefects:
  - ref: post-steelcodecheck-dialog-holds-the-session

operations:
  - method: POST
    surface:
      exportName: getSteelCodeCheck
      modulePath: [post, design]
      takesArgument: false
      documentation: |-
        docs/manual/23_POST_Design.md #2 — /post/STEELCODECHECK — Steel Code Check.

        Takes no arguments; returns ``{"vSECT": [...], "vELEM": [...]}`` — each
        entry has SECT/ELEM id, RAT (combined strength ratio), SLN (slenderness
        ratio), DEF (deflection), DEFA (allowable deflection).

        ⚠️ Can hold the whole session. On Gen NX (2026-10-20), an analysed model
        with a steel design code in ``/db/DSTL`` and no ``/db/LCOM-STEEL`` rows
        made this call not answer: Gen raised a "No Load Combination exists for
        Checking." dialog, and every following call, plain GETs included, waited
        until it was closed. Run it only after a steel design run has succeeded,
        with a short timeout; if it times out, look for that dialog on the NX
        host. Without a steel code it answers ``{"message": ""}``.
    risk: product_crash_risk
    mitigation: warn_only
    request:
      wrapper: argument
      itemSchema: empty
    response:
      wrapper: raw
    notes: >-
      A POST-shaped read: it returns design results and changes nothing. The
      manual's request example is `{"Argument": {}}`. Its only table is
      titled "Response 필드", and the fields below transcribe that table: they
      describe the body the server returns, `{"vSECT": [...], "vELEM": [...]}`
      with no wrapper, not anything a caller sends. Live, on both products,
      an analyzed model with no steel design code answered `{"message": ""}`;
      that is the nothing-to-show shape, not a failure. With a steel design
      code and no steel design combinations, Gen NX held the session behind a
      dialog instead (2026-10-20, knownDefects). A populated response has
      never been observed. mitigation is warn_only: the trigger is the state
      of the caller's model, which the request cannot express, so there is
      nothing to normalize or reject; both SDKs carry the warning on the
      function.

sdkRules:
  - id: post-steelcodecheck-may-hold-the-session
    kind: warn
    appliesTo: [POST]
    reason: >-
      On a model with a steel design code and no steel design combinations the
      call raises a modal dialog on the NX host and never answers, and the
      dialog blocks every other call until someone closes it. There is no error
      to catch, only a timeout, so the caller has to be told before the call.
    riskRef: post-steelcodecheck-dialog-holds-the-session
    alternative: >-
      Run the steel design (the code's CODE-ANAL) first and call this only
      after it succeeded, with a short timeout. Where the API has no steel
      design for the code, read member forces with /post/TABLE and check them
      outside the product.

