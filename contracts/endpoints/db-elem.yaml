# /db/ELEM
#
# Drafted by scripts/extract_contracts.py from the official manual, then promoted
# by scripts/promote_contract.py: products and verification status come from
# docs/coverage.json's live record, not from the manual's framing. For /db/*
# endpoints, the DELETE shape comes from measured /db/* DELETE behaviour.
# safeToOmit is answered `true` only where a confirmed live payload actually
# omitted the field.
contractVersion: 1
id: db-elem
endpoint: /db/ELEM
name: Element
surface:
  className: Element
  exportName: element
  modulePath: [db, nodeElement]
  payloadTypeName: ElementPayload

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 03_DB_Node_Element.md
    section: "2. `/db/ELEM`"
    url: https://support.midasuser.com/hc/en-us/articles/35806934300825
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-07-22
    - product: gen
      ref: db-write-sweep-2026-07-22

operations:
  - method: DELETE
    variant: per_id
    path: /db/ELEM/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: TYPE
    description: >-
      Element Type
    type: string
    requirement: optional
    documentedDefault: BEAM
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
  - key: MATL
    description: >-
      Material No.
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: SECT
    description: >-
      Section / Thickness No.
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: NODE
    description: >-
      Node No.
    type: array
    items:
      type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: C_RAT
    description: >-
      Cable length ratio.
    type: number
    requirement: unstated
    documentedDefault: null
    documentedOptional: null
    safeToOmit: unverified
    provenance: manual
    provenanceNote: >-
      Declared by the section's JSON Schema, which types it and describes it,
      and named by no Specifications table in the section - not the common keys
      and not any of the nine per-subtype tables. The manual therefore states no
      requiredness, no default and no subtype this belongs to, so none is
      claimed here. See MD-10.
  - key: LCAXIS
    description: >-
      Local axis.
    type: integer
    requirement: unstated
    documentedDefault: null
    documentedOptional: null
    safeToOmit: unverified
    provenance: manual
    provenanceNote: >-
      Declared by the section's JSON Schema, which types it and describes it,
      and named by no Specifications table in the section - not the common keys
      and not any of the nine per-subtype tables. The manual therefore states no
      requiredness, no default and no subtype this belongs to, so none is
      claimed here. See MD-10.

manualDefects:
  - describes: field_name
    manualSays: >-
      No Specifications table in the section names C_RAT or LCAXIS - neither the
      common keys nor any of the nine per-subtype tables, including the Cable
      table (STYPE: 3) that C_RAT's own description belongs with.
    actual: >-
      The section's JSON Schema declares `"C_RAT": {"description": "CABLE LENGTH
      RATIO", "type": "number"}` and `"LCAXIS": {"description": "LOCAL AXIS",
      "type": "integer"}` among the request properties.
    evidence: >-
      docs/manual_defects_register.md MD-10, measured by comparing every
      section's Specifications table against its own JSON Schema block. Both are
      declared here with requirement `unstated`: the schema gives a type and a
      description, and nothing in the section gives requiredness, a default, or
      the element subtype either one applies to.

sdkRules:
  - id: db-elem-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-elem-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

