manualDefects:
  - describes: requiredness
    manualSays: >-
      The common Specifications table marks `VEHICLE_TYPE_NAME` and
      `STANDARD_CODE` Required and `USER_LOAD_TYPE` Optional, with no reference
      to `VEHICLE_LOAD_NUM` - the field that decides which of them apply.
    actual: >-
      `VEHICLE_TYPE_NAME` is required only under `VEHICLE_LOAD_NUM: 1`;
      omitting it there is refused with `(Item:Length of Vehicular Load Type(0
      ~ 40 characters))`, and under `2` it is discarded if sent.
      `STANDARD_CODE` is not required under either branch - it was omitted and
      the record stored without it. `USER_LOAD_TYPE` is not an input at all
      under `MVLD_CODE: 2`: "Train", "Lane", "Truck", "TruckLane" and omission
      all stored "Truck/Lane". The chapter already carries the information, in
      the KSCE-LSD15 section's paired Standard and User Defined examples; what
      is missing is any statement that this is a branch, in the one table that
      presents itself as covering every code.
    evidence: >-
      docs/live_verification_notes.md, "/db/MVHL: the finding was real, the
      reading was not" (2026-09-03), against a Civil NX document confirmed
      empty first. Registered as MD-16.
  - describes: field_name
    manualSays: >-
      Four rows of the `VEH_CA` table give their Key as
      `"DYNA_FACTOR"`(`DYNA` 하위) - the parent named in Korean prose inside the
      Key cell, quotes included.
    actual: >-
      The chapter has a path syntax and uses it two rows later
      (`PERMIT_LOAD.IMPACT_FACTOR`), so these four should read
      `DYNA.DYNA_FACTOR` and so on. As transcribed they parse into keys with
      the quote characters still attached, plus a spurious `DYNA` scalar. The
      section's own Python example settles the shape: `"VEH_CA":
      {"DYN_LOAD_ALLOWANCE": 0, "DYNA": {"DYNA_FACTOR": 0}}`. Registered as
      MD-17.
    evidence: >-
      The section's own Request Example, 08_DB_Moving_Loads.md, against which
      the four rows were re-nested by hand in this contract's CANADA variant.
  - describes: behaviour
    manualSays: >-
      Nothing. `VEH_DEFAULT` is Required and every one of its ten members is
      Optional, which reads as "send the object, fill in what you need".
    actual: >-
      Sending `VEH_DEFAULT: {}` makes the whole write a silent no-op:
      `{"message": ""}`, no error object, and a following GET shows nothing was
      saved. Every member being omissible does not make the empty object
      equivalent to a populated one.
    evidence: >-
      docs/live_verification_notes.md; recorded in scripts/live_crud_check.py's
      moving-load seed, whose docstring carries the warning, and covered by the
      db-mvhl-veh-default-not-empty rule below.

sdkRules:
  - id: db-mvhl-veh-default-not-empty
    kind: reject_request
    appliesTo: [POST, PUT]
    fields: [VEH_DEFAULT]
    reason: >-
      An empty VEH_DEFAULT is accepted and silently saves nothing. The failure
      is invisible to the caller - success-shaped response, no error key - so
      both SDKs refuse the request rather than let a modelling script believe
      it defined a vehicle.
    alternative: >-
      Send the parameters the vehicle needs, or omit VEH_DEFAULT entirely and
      carry the STANDARD_CODE's own VEH_* object instead.
  - id: db-mvhl-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-mvhl-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

