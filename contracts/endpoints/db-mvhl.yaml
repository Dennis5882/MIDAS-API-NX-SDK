# /db/MVHL
#
# Drafted by scripts/extract_contracts.py from the official manual, then written
# by hand: scripts/promote_contract.py refuses this endpoint, because its common
# Specifications table states requiredness for both branches of
# VEHICLE_LOAD_NUM without naming the branch. What that field means, and which
# fields each branch really needs, was measured live on 2026-09-03 - see
# docs/live_verification_notes.md and MD-16.
contractVersion: 1
id: db-mvhl
endpoint: /db/MVHL
name: Vehicles
surface:
  className: Vehicles
  exportName: vehicles
  modulePath: [db, movingLoads]
  payloadTypeName: VehiclePayload

products: [civil, gen]

source:
  manual:
    status: documented
    repo: Dennis5882/MIDAS-API
    chapterFile: 08_DB_Moving_Loads.md
    section: 10. /db/MVHL – Vehicles
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_both
  records:
    - product: civil
      ref: db-write-sweep-2026-08-17
    - product: gen
      ref: db-write-sweep-2026-08-17
    - product: civil
      ref: mvhl-load-num-branches-2026-09-03

operations:
  - method: DELETE
    variant: per_id
    path: /db/MVHL/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Undocumented route, and the only DELETE form that deletes a selection
      rather than the whole table - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The manual's documented form. The ids in that body are ignored.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: unstable
    notes: >-
      The server renumbers a POSTed record. Keys 10-14, 20 and 21 landed at ids
      4-10 in one 2026-09-03 run, while the response echoed the key sent. Read
      the table back and match on a field you set before deleting by id.
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

fields:
  - key: MVLD_CODE
    description: >-
      Moving Load Code (Integer)
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: VEHICLE_LOAD_NAME
    description: >-
      Vehicular Load Name (user-assigned)
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
  - key: VEHICLE_LOAD_NUM
    description: >-
      Vehicular Load Number. This is the branch selector, not a count: 1 selects
      a standard DB vehicle and 2 a user-defined one, and the variants below say
      which fields each needs.
    type: integer
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: false
    omissionEffect: >-
      Rejected with `Wrong Field`, the same answer the server gives an
      unrecognised value. Measured against a live product on 2026-09-03.
    enum: [1, 2]
    provenance: live_verified
    # RESOLVED: the manual states no value set for this field; the two values are
    # measured against a live product on 2026-09-03, where 3 and omission both
    # answered Wrong Field and 1 and 2 each stored the branch the chapter's
    # own KSCE-LSD15 examples show. The chapter documents the pair only by
    # example, never as an enum
  - key: VEHICLE_TYPE_NAME
    description: >-
      Vehicular Type Name (predefined vehicle name)
    type: string
    requirement: required
    appliesWhen:
      - path: VEHICLE_LOAD_NUM
        equals: 1
    documentedDefault: null
    documentedOptional: false
    safeToOmit: false
    omissionEffect: >-
      Under VEHICLE_LOAD_NUM 1 the record is rejected with `[Error] Vehicle Load
      Data (Name:...) contains errors.(Item:Length of Vehicular Load Type(0 ~ 40
      characters))`. Under VEHICLE_LOAD_NUM 2 the field does not apply and is
      discarded if sent. Measured against a live product on 2026-09-03.
    provenance: manual
    # RESOLVED: the value is not validated. `"NOT-A-VEHICLE"` was accepted and stored
    # verbatim - measured against a live product on 2026-09-03 - and this name
    # is what selects which standard vehicle's axle loads the analysis uses,
    # so a typo here is silent. No enum is transcribed: the set is per
    # STANDARD_CODE and the chapter never lists it
  - key: STANDARD_CODE
    description: >-
      Standard Code. Selects which VEH_* parameter object the record carries;
      see the variants below.
    type: string
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: true
    omissionEvidence: >-
      Omitted from a VEHICLE_LOAD_NUM 1 HL-93TRK record under MVLD_CODE 2 and
      stored without it. docs/live_verification_notes.md, "/db/MVHL: the finding
      was real, the reading was not" (2026-09-03), against a Civil NX document
      confirmed empty first; verification record
      mvhl-load-num-branches-2026-09-03. This confirms by a write what
      VehiclePayload's docstring already recorded from a read: a real production
      Eurocode model's predefined Load Model 1 vehicle carries no STANDARD_CODE
      key at all.
    provenance: manual
    # RESOLVED: the value is enum-checked but not cross-checked. `"NOT-A-CODE"` answers
    # Wrong Field, while `"KS-RB"` was accepted and stored on an MVLD_CODE 2
    # (AASHTO LRFD) HL-93TRK vehicle - measured against a live product on
    # 2026-09-03. The chapter's footnote lists fifteen values and says they
    # are the 주요 (principal) ones, so no enum is transcribed from a list its
    # own text does not close
  - key: USER_LOAD_TYPE
    description: >-
      User Load Type (when user-defined)
    type: string
    requirement: optional
    appliesWhen:
      - path: VEHICLE_LOAD_NUM
        equals: 2
    documentedDefault: null
    documentedOptional: true
    safeToOmit: true
    omissionEvidence: >-
      Omitted from a VEHICLE_LOAD_NUM 2 record and stored, the server supplying
      "Truck/Lane". docs/live_verification_notes.md, "/db/MVHL: the finding was
      real, the reading was not" (2026-09-03), against a Civil NX document
      confirmed empty first; verification record
      mvhl-load-num-branches-2026-09-03.
    provenance: manual
    # RESOLVED: under MVLD_CODE 2 the server ignores whatever is sent here and stores
    # "Truck/Lane": `"Train"`, `"Lane"`, `"Truck"`, `"TruckLane"` and omission
    # all produced the same record - measured against a live product on
    # 2026-09-03. The KSCE-LSD15 article names Train and Lane as real modes,
    # so the value is presumably honoured under the codes that have them;
    # nobody has driven one
  - key: VEH_DEFAULT
    description: >-
      Default Parameters. Used by AASHTO Standard/LRFD, PENNDOT, Korea (KS-RB)
      and Taiwan only; every other STANDARD_CODE carries its own object instead
      - see the variants below.
    type: object
    requirement: required
    documentedDefault: null
    documentedOptional: false
    safeToOmit: unverified
    provenance: manual
    # RESOLVED: an empty object is not the same as omission, measured against a
    # live product. Sending `VEH_DEFAULT: {}` makes the write a silent no-op -
    # `{"message": ""}`, no error, and a following GET shows nothing saved -
    # even though every one of its members is documented Optional. Recorded in
    # live_crud_check.py's moving-load seed and refused by both SDKs through
    # the db-mvhl-veh-default-not-empty rule below
    properties:
      - key: UNIFORM_LOAD
        description: >-
          Uniform Load
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: DYN_LOAD_ALLOWANCE
        description: >-
          Dynamic Load Allowance (%)
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: W1
        description: >-
          Width 1 (W1)
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: W2
        description: >-
          Width 2 (W2)
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: D1
        description: >-
          Distance 1 (D1)
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: D2
        description: >-
          Distance 2 (D2)
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: PL
        description: >-
          Point Load (PL)
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: PLM
        description: >-
          PLM
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: PLV
        description: >-
          PLV
        type: number
        requirement: optional
        documentedDefault: null
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
      - key: CENT_F
        description: >-
          Add Centrifugal Force
        type: boolean
        requirement: optional
        documentedDefault: false
        documentedOptional: true
        safeToOmit: unverified
        provenance: manual
  - key: LOAD_ITEMS
    description: >-
      User-defined axle-load items
    type: array
    items:
      type: object
    requirement: optional
    appliesWhen:
      - path: VEHICLE_LOAD_NUM
        equals: 2
    documentedDefault: null
    documentedOptional: true
    safeToOmit: unverified
    provenance: manual
    properties:
      - key: POINT_LOAD
        description: >-
          Point Load
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual
      - key: POINT_DIST
        description: >-
          Point Distance
        type: number
        requirement: required
        documentedDefault: null
        documentedOptional: false
        safeToOmit: unverified
        provenance: manual

