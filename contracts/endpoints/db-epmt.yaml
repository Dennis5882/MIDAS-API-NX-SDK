manualDefects:
  - describes: field_name
    manualSays: >-
      The Specifications table lists two keys, NAME and MODEL_TYPE. The six
      model-parameter objects appear only as sub-table headings
      (`Tresca / Von-Mises 공통 파라미터 ("TRESCA" or "VMISES" object)`), never as rows
      with a key of their own.
    actual: >-
      The same section's JSON Schema declares TRESCA, VMISES, MOHRCL, DRUCKER,
      MASONRY and CONCDMG as object properties of the request, and its Request
      Body sends `"MODEL_TYPE": "VM"` alongside a `"VMISES"` object. A contract
      built from the table alone would be missing the entire payload below the
      model type.
    evidence: >-
      docs/manual_defects_register.md MD-10, measured by comparing every
      section's Specifications table against its own JSON Schema block. The
      six objects are declared here as conditional fields on MODEL_TYPE, whose
      six values the Specifications row does enumerate; their members are not,
      because the sub-tables carry no Value Type column.

sdkRules:
  - id: db-epmt-delete-per-id
    kind: per_id_request
    appliesTo: [DELETE]
    variant: per_id
    reason: >-
      The manual's DELETE body form empties the whole table regardless of the
      ids it names. Measured on /db/NODE, /db/STLD, /db/LDGR and /db/MATL and
      treated as a property of /db/* DELETE, so an SDK's ordinary "delete these
      ids" call must use the undocumented per-id URL. Requests go one at a time
      and stop at the first failure.
    riskRef: db-delete-body-empties-table
    alternative: Emptying the table on purpose is the separate whole_table operation.
  - id: db-epmt-delete-all-confirmation
    kind: require_confirmation
    appliesTo: [DELETE]
    variant: whole_table
    reason: >-
      Emptying the table cannot be undone through the API and raises no
      product-side dialog.
    riskRef: db-delete-body-empties-table
    alternative: Use the per_id DELETE operation to remove selected records.

knownDefects:
  - ref: db-delete-body-empties-table

