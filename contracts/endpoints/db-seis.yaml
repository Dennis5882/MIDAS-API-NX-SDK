# /db/SEIS
#
# Written from GET /info/db/SEIS (Gen NX, captured 2026-11-04) and the 2026-11-04
# Gen NX session in docs/live_verification_notes.md. The manual has no
# section for this endpoint, so every field is provenance: info_schema and
# requirement: unstated; live findings are recorded on the fields they touch.
contractVersion: 1
id: db-seis
endpoint: /db/SEIS
name: Seismic Loads (legacy)
summary: >-
  The legacy per-country static seismic loads, one record per seismic load case. MIDASIT keeps it without maintenance; it is the only API route for the overseas codes, since /db/SSEIS takes KDS and USER TYPE only.
surface:
  className: LegacySeismicLoad
  exportName: legacySeismicLoad
  modulePath: [db, staticLoads]
  payloadTypeName: LegacySeismicLoadPayload

products: [gen]
productsEvidence: >-
  Civil NX answered both the route and GET /info/db/SEIS with a 404 on
  2026-11-04, the same day Gen NX wrote and read them.

recordKey:
  kind: record_id
  description: >-
    The /db/STLD load case number the record belongs to.

source:
  manual:
    status: absent
    justification: >-
      No manual chapter documents /db/SEIS. The fields below are the server's own GET /info/db/SEIS schema; methods, the record key and the failure shapes come from the 2026-11-04 Gen NX session recorded in docs/live_verification_notes.md, which stored KBC2016 and EURO2004 records and updated and deleted them. SEIS_LOAD_CODE takes the code object's own name (KBC2016, EURO2004), except NSCP 2024.
  liveNotes:
    - docs/live_verification_notes.md

verification:
  status: verified_gen
  records:
    - product: gen
      ref: db-wind-seis-legacy-2026-11-04

operations:
  - method: DELETE
    variant: per_id
    path: /db/SEIS/{id}
    risk: destructive
    mitigation: none
    summary: Delete exactly the record named in the path.
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
    notes: >-
      Measured 2026-11-04 on Gen NX: removed the named record, and a GET of it
      then answered Not Found Key - see risk db-delete-body-empties-table.
  - method: DELETE
    variant: whole_table
    risk: destructive
    mitigation: confirmation_required
    summary: Empty the entire table.
    request:
      wrapper: assign
      itemSchema: none
      description: >-
        The /db/* body form, never sent to this endpoint; listed so both SDKs
        guard it like every other table.
    response:
      wrapper: message
  - method: GET
    risk: read_only
    request:
      wrapper: none
    response:
      wrapper: table
      keyStability: stable
  - method: POST
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable
  - method: PUT
    risk: write
    request:
      wrapper: assign
      itemSchema: fields
    response:
      wrapper: table
      keyStability: stable

